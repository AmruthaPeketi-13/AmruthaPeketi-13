<svg xmlns="http://www.w3.org/2000/svg" width="830" height="310" viewBox="0 0 830 310" role="img" aria-labelledby="t d"><title id="t">HomeFinder</title><desc id="d">Full-stack rental and valuation platform. Multi-tier real estate platform on React, TypeScript, Node.js, Express, and MongoDB with JWT authentication. Flask microservice running an XGBoost regression model predicts dynamic rent at 80% accuracy. Responsive Tailwind CSS and shadcn/ui workflows over RESTful pipelines tuned for low latency.</desc><style>@font-face{font-family:'Josefin Sans';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Josefin Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><rect x="0.6" y="0.6" width="828.8" height="308.8" rx="14" fill="#ffffff" stroke="#e3d8b6" stroke-width="1.2"/><text x="44" y="60" font-family="'Josefin Sans', serif" font-size="27" font-weight="700" fill="#1b2a41" text-anchor="start">HomeFinder</text><text x="786" y="58" font-family="'Josefin Sans', serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end" letter-spacing="1">2026</text><text x="44" y="86" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#96701a" text-anchor="start" letter-spacing="2">FULL-STACK RENTAL AND VALUATION PLATFORM</text><line x1="44" y1="102" x2="786" y2="102" stroke="#e3d8b6" stroke-opacity=".7"/><path d="M50 122 L53 125 L50 128 L47 125 Z" fill="#96701a"/><text x="66" y="130" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">Multi-tier real estate platform on React, TypeScript, Node.js, Express, and MongoDB with JWT</text><text x="66" y="152" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">authentication.</text><path d="M50 172 L53 175 L50 178 L47 175 Z" fill="#96701a"/><text x="66" y="180" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2