<svg xmlns="http://www.w3.org/2000/svg" width="830" height="310" viewBox="0 0 830 310" role="img" aria-labelledby="t d"><title id="t">Hindsight</title><desc id="d">AI-powered operational memory and incident resolution platform. Gemini LLMs and RAG on Node.js, Prisma, and PostgreSQL automate real-time incident resolution as a production-grade cloud service. pgvector semantic search with cosine similarity across incident logs cut resolution time by 40%. Server-Sent Events stream generated answers live, secured with token-based JWT authentication.</desc><style>@font-face{font-family:'Josefin Sans';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Josefin Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><rect x="0.6" y="0.6" width="828.8" height="308.8" rx="14" fill="#ffffff" stroke="#e3d8b6" stroke-width="1.2"/><text x="44" y="60" font-family="'Josefin Sans', serif" font-size="27" font-weight="700" fill="#1b2a41" text-anchor="start">Hindsight</text><text x="786" y="58" font-family="'Josefin Sans', serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end" letter-spacing="1">2026</text><text x="44" y="86" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#96701a" text-anchor="start" letter-spacing="2">AI-POWERED OPERATIONAL MEMORY AND INCIDENT RESOLUTION PLATFORM</text><line x1="44" y1="102" x2="786" y2="102" stroke="#e3d8b6" stroke-opacity=".7"/><path d="M50 122 L53 125 L50 128 L47 125 Z" fill="#96701a"/><text x="66" y="130" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">Gemini LLMs and RAG on Node.js, Prisma, and PostgreSQL automate real-time incident resolution as</text><text x="66" y="152" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">a production-grade cloud service.</text><path d="M50 172 L53 175 L50 178 L47 175 Z" fill="#96701a"/><text x="66" y="180" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">pgvector semantic search with cosine similarity across incident logs cut resolution time by 40%.</text><path d="M50 200 L53 203 L50 206 L47 203 Z" fill="#96701a"/><text x="66" y="208" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">Server-Sent Events stream generated answers live, secured with token-based JWT authentication.</text><rect x="44" y="225" width="64.5" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="76.23125" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">Gemini</text><rect x="116.4625" y="225" width="49.9" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="141.40625" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">RAG</text><rect x="174.35000000000002" y="225" width="67.1" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="207.90625000000003" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">Node.js</text><rect x="249.46250000000003" y="225" width="63.0" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="280.98125000000005" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">Prisma</text><rect x="320.5" y="225" width="95.6" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="368.31875" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">PostgreSQL</text><rect x="424.1375" y="225" width="75.3" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="461.76874999999995" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">pgvector</text><rect x="507.4" y="225" width="46.2" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="530.5" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">SSE</text><rect x="561.6" y="225" width="47.9" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="585.5625" y="242" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">JWT</text><text x="762" y="280" font-family="'Josefin Sans', serif" font-size="12" font-weight="700" fill="#96701a" text-anchor="end" letter-spacing="2.5">VIEW REPOSITORY</text><path d="M770 276 H784 M779 271 L784 276 L779 281" fill="none" stroke="#96701a" stroke-width="1.6"/></svg>