<svg xmlns="http://www.w3.org/2000/svg" width="830" height="332" viewBox="0 0 830 332" role="img" aria-labelledby="t d"><title id="t">AyuSetu</title><desc id="d">Blockchain supply chain traceability platform. Hyperledger Fabric network across multi-org nodes records immutable, tamper-resistant supply chain provenance. Smart contracts enforce automated quality gates based on DNA tests and moisture thresholds. IPFS holds lab certificates off-chain, and cryptographic QR codes give consumers real-time provenance checks.</desc><style>@font-face{font-family:'Josefin Sans';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Josefin Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><rect x="0.6" y="0.6" width="828.8" height="330.8" rx="14" fill="#ffffff" stroke="#e3d8b6" stroke-width="1.2"/><text x="44" y="60" font-family="'Josefin Sans', serif" font-size="27" font-weight="700" fill="#1b2a41" text-anchor="start">AyuSetu</text><text x="786" y="58" font-family="'Josefin Sans', serif" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end" letter-spacing="1">2025  ·  SIH national finalist</text><text x="44" y="86" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#96701a" text-anchor="start" letter-spacing="2">BLOCKCHAIN SUPPLY CHAIN TRACEABILITY PLATFORM</text><line x1="44" y1="102" x2="786" y2="102" stroke="#e3d8b6" stroke-opacity=".7"/><path d="M50 122 L53 125 L50 128 L47 125 Z" fill="#96701a"/><text x="66" y="130" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">Hyperledger Fabric network across multi-org nodes records immutable, tamper-resistant supply chain</text><text x="66" y="152" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">provenance.</text><path d="M50 172 L53 175 L50 178 L47 175 Z" fill="#96701a"/><text x="66" y="180" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">Smart contracts enforce automated quality gates based on DNA tests and moisture thresholds.</text><path d="M50 200 L53 203 L50 206 L47 203 Z" fill="#96701a"/><text x="66" y="208" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">IPFS holds lab certificates off-chain, and cryptographic QR codes give consumers real-time provenance</text><text x="66" y="230" font-family="'Josefin Sans', serif" font-size="15" font-weight="400" fill="#1b2a41" text-anchor="start">checks.</text><rect x="44" y="247" width="140.9" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="114.4625" y="264" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">Hyperledger Fabric</text><rect x="192.925" y="247" width="121.7" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="253.79375000000002" y="264" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">Smart Contracts</text><rect x="322.6625" y="247" width="49.9" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="347.60625000000005" y="264" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">IPFS</text><rect x="380.55" y="247" width="67.1" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="414.10625000000005" y="264" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">Node.js</text><rect x="455.6625" y="247" width="116.7" height="26" rx="13" fill="none" stroke="#e3d8b6"/><text x="514.025" y="264" font-family="'Josefin Sans', serif" font-size="12.5" font-weight="400" fill="#1b2a41" text-anchor="middle" letter-spacing="0.5">QR provenance</text><text x="762" y="302" font-family="'Josefin Sans', serif"