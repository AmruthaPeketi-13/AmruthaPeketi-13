ing pipelines and worked with cross-functional teams on production AI</text><text x="106" y="209" font-family="'Josefin Sans', serif" font-size="14.5" font-weight="400" fill="#1b2a41" text-anchor="start">features.</text><path d="M92 223.4 L94.6 226 L92 228.6 L89.4 226 Z" fill="#e3d8b6"/><text x="106" y="231" font-family="'Josefin Sans', serif" font-size="14.5" font-weight="400" fill="#1b2a41" text-anchor="start">Evaluated model performance metrics to iterate on recommendation accuracy for end users.</text><path d="M62 260 L68 266 L62 272 L56 266 Z" fill="#96701a"/><text x="86" y="271" font-family="'Josefin Sans', serif" font-size="19" font-weight="700" fill="#1b2a41" text-anchor="start">Freelance Frontend Engineer</text><text x="86" y="295" font-family="'Josefin Sans', serif" font-size="13.5" font-weight="400" fill="#96701a" text-anchor="start" letter-spacing="1">Startup  ·  Feb 2026 - May 2026</text><path d="M92 321.4 L94.6 324 L92 326.6 L89.4 324 Z" fill="#e3d8b6"/><text x="106" y="329" font-family="'Josefin Sans', serif" font-size="14.5" font-weight="400" fill="#1b2a41" text-anchor="start">Built the marketplace frontend for 10+ service categories with Next.js, React, and Tailwind CSS, deployed</text><text x="106" y="350" font-family="'Josefin Sans', serif" font-size="14.5" font-weight="400" fill="#1b2a41" text-anchor="start">on Vercel.</text><path d="M92 364.4 L94.6 367 L92 369.6 L89.4 367 Z" fill="#e3d8b6"/><text x="106" y="372" font-family="'Josefin Sans', serif" font-size="14.5" font-weight="400" fill="#1b2a41" text-anchor="start">Integrated secure REST APIs and managed state with an object-oriented component architecture.</text><path d="M92 386.4 L94.6 389 L92 391.6 L89.4 389 Z" fill="#e3d8b6"/><text x="106" y="394" font-family="'Josefin Sans', serif" font-size="14.5" font-weight="400" fill="#1b2a41" text-anchor="start">Shipped real-time search and interactive filters to speed up discovery and booking.</text></svg>